<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ManusXL Desktop</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d241f;
        --muted: #718077;
        --line: #d8e2d8;
        --surface: #f7faf6;
        --accent: #1d241f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #eef4ee;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 22px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      label,
      section {
        display: grid;
        gap: 7px;
      }

      span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
      }

      button.danger {
        border: 1px solid #efc6c0;
        background: #fff1f0;
        color: #9f2a22;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .panel {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 14px;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .chip {
        border-radius: 999px;
        background: white;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 800;
      }

      pre {
        max-height: 170px;
        overflow: auto;
        border-radius: 8px;
        background: #111911;
        color: #dce8dc;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .task-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .request-path {
        overflow-wrap: anywhere;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>ManusXL Desktop</h1>
        <p>把本机文件、应用和授权动作安全接到 ManusXL Web。</p>
      </section>

      <section class="panel">
        <label>
          <span>Web Server</span>
          <input id="serverUrl" value="http://localhost:3000" />
        </label>
        <button class="secondary" id="saveServer">保存服务器地址</button>
      </section>

      <section class="panel">
        <label>
          <span>设备名称</span>
          <input id="deviceName" placeholder="ManusXL Desktop MacBook" />
        </label>
        <label>
          <span>配对码</span>
          <input id="pairingCode" placeholder="在 Web 设置页生成，例如 123-456" />
        </label>
        <button id="pairButton">配对桌面端</button>
      </section>

      <section class="panel">
        <div class="status">
          <strong>连接状态</strong>
          <span class="chip" id="statusChip">loading</span>
        </div>
        <button class="secondary" id="heartbeatButton">立即心跳</button>
        <pre id="log">{}</pre>
      </section>

      <section class="panel">
        <div class="status">
          <strong>当前任务</strong>
          <span class="chip" id="taskStatusChip">idle</span>
        </div>
        <p class="task-title" id="taskPrompt">暂无正在执行的任务。</p>
        <button class="danger" id="stopTaskButton" disabled>停止当前任务</button>
      </section>

      <section class="panel">
        <div class="status">
          <strong>云端文件同步</strong>
          <span class="chip" id="uploadStatusChip">ready</span>
        </div>
        <p class="task-title" id="uploadSummary">选择一个本机文件上传到云端上传库，默认 7 天 TTL。</p>
        <button class="secondary" id="uploadFileButton">上传本机文件到云端</button>
      </section>

      <section class="panel">
        <div class="status">
          <strong>上传审批</strong>
          <span class="chip" id="requestStatusChip">0 pending</span>
        </div>
        <p id="requestReason">暂无待处理的本机文件上传请求。</p>
        <p class="request-path" id="requestPath"></p>
        <div class="actions">
          <button id="approveRequestButton" disabled>批准上传</button>
          <button class="danger" id="denyRequestButton" disabled>拒绝</button>
        </div>
      </section>
    </main>

    <script>
      const api = window.manusxlDesktop;
      const serverUrl = document.getElementById("serverUrl");
      const deviceName = document.getElementById("deviceName");
      const pairingCode = document.getElementById("pairingCode");
      const pairButton = document.getElementById("pairButton");
      const heartbeatButton = document.getElementById("heartbeatButton");
      const saveServer = document.getElementById("saveServer");
      const statusChip = document.getElementById("statusChip");
      const taskStatusChip = document.getElementById("taskStatusChip");
      const taskPrompt = document.getElementById("taskPrompt");
      const stopTaskButton = document.getElementById("stopTaskButton");
      const uploadStatusChip = document.getElementById("uploadStatusChip");
      const uploadSummary = document.getElementById("uploadSummary");
      const uploadFileButton = document.getElementById("uploadFileButton");
      const requestStatusChip = document.getElementById("requestStatusChip");
      const requestReason = document.getElementById("requestReason");
      const requestPath = document.getElementById("requestPath");
      const approveRequestButton = document.getElementById("approveRequestButton");
      const denyRequestButton = document.getElementById("denyRequestButton");
      const log = document.getElementById("log");
      let currentFileRequestId = "";

      function render(value) {
        log.textContent = JSON.stringify(value, null, 2);
        statusChip.textContent = value.configured || value.ok ? "connected" : "not paired";
        const currentTask = value.currentTask;
        taskStatusChip.textContent = currentTask ? currentTask.status : "idle";
        taskPrompt.textContent = currentTask ? currentTask.prompt : "暂无正在执行的任务。";
        stopTaskButton.disabled = !currentTask;
        const upload = value.lastUpload;
        uploadStatusChip.textContent = upload?.ok ? "uploaded" : "ready";
        uploadSummary.textContent = upload?.file
          ? `${upload.file.name} · ${upload.file.size} bytes · expires ${upload.expiresAt || "unknown"}`
          : "选择一个本机文件上传到云端上传库，默认 7 天 TTL。";
        const pendingRequests = value.pendingFileRequests || value.lastHeartbeat?.fileRequests || value.fileRequests || [];
        const request = pendingRequests[0];
        currentFileRequestId = request?.id || "";
        requestStatusChip.textContent = `${pendingRequests.length} pending`;
        requestReason.textContent = request
          ? request.reason
          : value.lastFileRequest
            ? `最近处理：${value.lastFileRequest.status}`
            : "暂无待处理的本机文件上传请求。";
        requestPath.textContent = request?.requestedPath || "";
        approveRequestButton.disabled = !request;
        denyRequestButton.disabled = !request;
        if (value.serverUrl) serverUrl.value = value.serverUrl;
        if (value.deviceName) deviceName.value = value.deviceName;
      }

      async function loadStatus() {
        render(await api.status());
      }

      saveServer.addEventListener("click", async () => {
        try {
          render(await api.updateServerUrl(serverUrl.value));
        } catch (error) {
          render({ error: String(error) });
        }
      });

      pairButton.addEventListener("click", async () => {
        try {
          const result = await api.pair(pairingCode.value, deviceName.value);
          pairingCode.value = "";
          render({ paired: true, ...result });
        } catch (error) {
          render({ paired: false, error: String(error) });
        }
      });

      heartbeatButton.addEventListener("click", async () => {
        try {
          render(await api.heartbeat());
        } catch (error) {
          render({ ok: false, error: String(error) });
        }
      });

      stopTaskButton.addEventListener("click", async () => {
        try {
          render(await api.cancelCurrentTask());
        } catch (error) {
          render({ ok: false, error: String(error) });
        }
      });

      uploadFileButton.addEventListener("click", async () => {
        try {
          render(await api.uploadFile());
        } catch (error) {
          render({ ok: false, error: String(error) });
        }
      });

      approveRequestButton.addEventListener("click", async () => {
        if (!currentFileRequestId) return;
        try {
          render(await api.approveFileRequest(currentFileRequestId));
        } catch (error) {
          render({ ok: false, error: String(error) });
        }
      });

      denyRequestButton.addEventListener("click", async () => {
        if (!currentFileRequestId) return;
        try {
          render(await api.denyFileRequest(currentFileRequestId));
        } catch (error) {
          render({ ok: false, error: String(error) });
        }
      });

      api.onStatus?.((status) => render(status));

      loadStatus();
    </script>
  </body>
</html>
