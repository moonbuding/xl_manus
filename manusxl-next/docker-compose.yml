services:
  manusxl:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      MANUSXL_DATABASE_PROVIDER: "${MANUSXL_DATABASE_PROVIDER:-sqlite}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://manusxl:manusxl@postgres:5432/manusxl}"
    ports:
      - "${MANUSXL_PORT:-3001}:3000"
    volumes:
      - manusxl_data:/app/.manusxl-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/config').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-manusxl}"
      POSTGRES_USER: "${POSTGRES_USER:-manusxl}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-manusxl}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-manusxl} -d $${POSTGRES_DB:-manusxl}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observability
    depends_on:
      - manusxl
      - alertmanager
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alertmanager/rules.yml:/etc/prometheus/rules/manusxl-alerts.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    profiles:
      - observability
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observability
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-manusxl}"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  manusxl_data:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
